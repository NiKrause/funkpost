name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Install scripts one at a time. Three @meshtastic packages each run
      # `npx only-allow pnpm` on install; in parallel, on a cold npm cache (every
      # lockfile change), they race to fetch it into one npx directory and one
      # finds nothing: "sh: only-allow: not found", which failed #115's deploy.
      - run: npm ci --foreground-scripts
      - run: npm test
      - run: npm test -w @le-space/mesh-calendar-example
      - run: npm test -w @le-space/recovery-example
      - run: npm run build -w @le-space/mesh-todo-example
      # Every app the Pages workflow deploys builds here first, so a broken
      # import fails the PR rather than the deploy after the merge.
      - run: npm run build -w @le-space/mesh-calendar-example
      - run: npm run build -w @le-space/recovery-example
      - run: npx playwright install --with-deps chromium
        working-directory: examples/mesh-todo
      - run: npm run test:e2e -w @le-space/mesh-todo-example
      # The booking demo drives two roles over the fake mesh: request, decide,
      # converge, download the .ics and parse it back.
      - run: npm run test:e2e -w @le-space/mesh-calendar-example
      - run: npm run test:e2e -w @le-space/recovery-example
