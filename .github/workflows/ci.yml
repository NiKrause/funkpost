name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm test -w @le-space/mesh-appointments-example
      - run: npm run build -w @le-space/mesh-todo-example
      - run: npx playwright install --with-deps chromium
        working-directory: examples/mesh-todo
      - run: npm run test:e2e -w @le-space/mesh-todo-example
      # The booking demo drives two roles over the fake mesh: request, decide,
      # converge, download the .ics and parse it back.
      - run: npm run test:e2e -w @le-space/mesh-appointments-example
