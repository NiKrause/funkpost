name: Deploy the demos to GitHub Pages

# The phones need an HTTPS address — Web Bluetooth refuses insecure origins.
# Every push to main publishes an index and both demos:
#
#   https://nikrause.github.io/funkpost/           the menu
#   https://nikrause.github.io/funkpost/mesh-todo/ mesh-todo    (OrbitDB plane)
#   https://nikrause.github.io/funkpost/termine/   mesh-calendar (Yjs plane)
#
# The /termine/ path is a ONE-WAY DOOR: every .ics ever downloaded carries a
# change/cancel link pointing at it, and a calendar entry from last spring must
# still lead somewhere. It matches DEFAULT_BASE in mesh-calendar's
# link.js — change one and you must change the other, and break old links.
#
# /mesh-todo/ is new: that demo used to sit at the root. It has no permanent
# links pointing into it, so moving it costs an old bookmark one click through
# the menu — which is why only this one was allowed to move.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @le-space/mesh-todo-example
        env:
          PAGES_BASE: /funkpost/mesh-todo/
      - run: npm run build -w @le-space/mesh-calendar-example
        env:
          PAGES_BASE: /funkpost/termine/
      # Assemble the site rather than nesting one demo inside another's build
      # output: each demo owns its directory, and the index owns the root.
      - run: |
          mkdir -p site/mesh-todo site/termine
          cp examples/landing/index.html site/index.html
          cp -R examples/mesh-todo/dist/. site/mesh-todo/
          cp -R examples/mesh-calendar/dist/. site/termine/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
