<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mesh-trail</title>
    <meta name="description" content="Each device says where it is on a schedule; every other device hears it and draws the trail. No internet, no database." />
    <!-- The social card. A link to this page in a chat, a toot or a ticket was
         a bare URL until now: no title, no picture, nothing that says what it
         is. `og:image` is absolute on purpose — a scraper does not run the page
         and several of them refuse to resolve a relative one. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="funkpost" />
    <meta property="og:title" content="mesh-trail — everyone on one map" />
    <meta property="og:description" content="Each device says where it is on a schedule; every other device hears it and draws the trail. No internet, no database." />
    <meta property="og:url" content="https://nikrause.github.io/funkpost/mesh-trail/" />
    <meta property="og:image" content="https://nikrause.github.io/funkpost/mesh-trail/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Two walking trails in cyan and violet with a coral head, on a dark ground: mesh-trail." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0e15" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8fb" />
    <!-- Before the first paint: the language (the address, then the last choice,
         then the browser) and a theme chosen earlier — the brand's pill keeps both. -->
    <script>
      (function(){var d=document.documentElement,s=function(k){try{return localStorage.getItem(k)}catch(e){return null}},q=new URLSearchParams(location.search).get("lang"),l=q==="de"||q==="en"?q:s("ls-locale");if(l!=="de"&&l!=="en"){l="en";var a=navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language];for(var i=0;i<a.length;i++){if(/^de\b/i.test(a[i])){l="de";break}if(/^en\b/i.test(a[i]))break}}d.lang=l;var t=s("ls-theme");if(t==="dark"||t==="light")d.dataset.theme=t})();
    </script>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon-32.png" sizes="32x32" />
    <!-- favicon.svg, not icon.svg: the app icon carries two walks and their
         faded tails, and at sixteen pixels in a tab strip that is a smudge.
         The favicon keeps one trail and the head of it. -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
