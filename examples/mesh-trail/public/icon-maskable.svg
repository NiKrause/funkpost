<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#0B0E15"/>
  <!-- Scaled to 0.76 about the centre: a maskable icon is cropped to a
       circle by the launcher, and a trail that runs into the corners
       loses both its ends. -->
  <g transform="translate(256 256) scale(0.76) translate(-256 -256)">
  <circle cx="64" cy="70" r="3" fill="#EDF1F8" opacity="0.5"/>
  <circle cx="300" cy="56" r="2.5" fill="#EDF1F8" opacity="0.45"/>
  <circle cx="468" cy="212" r="3" fill="#EDF1F8" opacity="0.4"/>
  <circle cx="54" cy="424" r="2.5" fill="#EDF1F8" opacity="0.35"/>
  <circle cx="412" cy="438" r="2.5" fill="#EDF1F8" opacity="0.4"/>
  <circle cx="146" cy="44" r="2" fill="#EDF1F8" opacity="0.35"/>
  <!-- One walk, drawn the way the app draws it: a line through the places a
       device said it was, fading towards where it started. -->
  <path d="M 96 408 C 150 350 150 300 196 268 C 250 230 262 180 324 152"
        fill="none" stroke="#58C7F3" stroke-width="22" stroke-linecap="round" opacity="0.85"/>
  <circle cx="96" cy="408" r="16" fill="#58C7F3" opacity="0.3"/>
  <circle cx="196" cy="268" r="18" fill="#58C7F3" opacity="0.55"/>
  <!-- A second walker, because the whole point is that there is more than one -->
  <path d="M 404 420 C 372 360 390 318 428 282"
        fill="none" stroke="#9A7BFF" stroke-width="16" stroke-linecap="round" opacity="0.6"/>
  <circle cx="404" cy="420" r="12" fill="#9A7BFF" opacity="0.35"/>
  <circle cx="428" cy="282" r="20" fill="#9A7BFF"/>
  <!-- The head of the first trail: where that device is now -->
  <circle cx="324" cy="152" r="44" fill="#FF6B5B"/>

  </g>
</svg>
