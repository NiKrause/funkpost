<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Termine über Funk</title>
    <meta name="description" content="Rules rather than lists: three weeks of free slots in one frame, and a booking that crossed a real mesh in 31 seconds." />
    <!-- The social card. A link to this page in a chat, a toot or a ticket was
         a bare URL until now: no title, no picture, nothing that says what it
         is. `og:image` is absolute on purpose — a scraper does not run the page
         and several of them refuse to resolve a relative one. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="funkpost" />
    <meta property="og:title" content="mesh-calendar — a hairdresser's appointment book" />
    <meta property="og:description" content="Rules rather than lists: three weeks of free slots in one frame, and a booking that crossed a real mesh in 31 seconds." />
    <meta property="og:url" content="https://nikrause.github.io/funkpost/mesh-calendar/" />
    <meta property="og:image" content="https://nikrause.github.io/funkpost/mesh-calendar/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A violet calendar outline with a coral mark, on a dark ground: mesh-calendar, the event plane." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0E86C4" />
    <!-- Before the first paint: the language (the address, then the last choice,
         then the browser) and a theme chosen earlier — the brand's pill keeps both. -->
    <script>
      (function(){var d=document.documentElement,s=function(k){try{return localStorage.getItem(k)}catch(e){return null}},q=new URLSearchParams(location.search).get("lang"),pth=(location.pathname.match(/\/(de|en)\/?$/)||[])[1],l=q==="de"||q==="en"?q:(pth==="de"||pth==="en"?pth:s("ls-locale"));if(l!=="de"&&l!=="en"){l="en";var a=navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language];for(var i=0;i<a.length;i++){if(/^de\b/i.test(a[i])){l="de";break}if(/^en\b/i.test(a[i]))break}}d.lang=l;var t=s("ls-theme");if(t==="dark"||t==="light")d.dataset.theme=t})();
    </script>
    <link rel="canonical" href="https://nikrause.github.io/funkpost/mesh-calendar/" />
    <link rel="alternate" hreflang="en" href="https://nikrause.github.io/funkpost/mesh-calendar/" />
    <link rel="alternate" hreflang="de" href="https://nikrause.github.io/funkpost/mesh-calendar/de/" />
    <link rel="alternate" hreflang="x-default" href="https://nikrause.github.io/funkpost/mesh-calendar/" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:locale:alternate" content="de_DE" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon-32.png" sizes="32x32" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
